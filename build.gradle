plugins {
    id 'java'
    id 'com.vanniktech.maven.publish' version '0.37.0'
    id 'com.diffplug.spotless' version '8.12.0'
    id 'io.github.ben-manes.versions' version '0.67.0'
}

group = 'com.formkiq'
version = '1.19.3-SNAPSHOT'

repositories {
    mavenLocal()
    mavenCentral()
}

spotless { 
    java { 
      eclipse().configFile project.rootProject.file("spotless.eclipseformat.xml") 
    } 
}
  
dependencies {
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    implementation "software.amazon.awssdk:auth:2.59.10"
    
    implementation "javax.ws.rs:javax.ws.rs-api:2.1.1"
    implementation "com.squareup.okhttp3:okhttp:5.5.1"
    implementation "com.squareup.okhttp3:logging-interceptor:5.5.1"
    implementation "com.google.code.gson:gson:2.15.0"
    implementation "io.gsonfire:gson-fire:1.9.0"
    implementation "org.apache.commons:commons-lang3:3.22.0"
    // Generated sources use javax.annotation; Jakarta Annotation 2+ changes the package.
    compileOnly "jakarta.annotation:jakarta.annotation-api:1.3.5"
    implementation "org.openapitools:jackson-databind-nullable:0.2.13"

    // test dependencies
    testImplementation platform("org.junit:junit-bom:6.1.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.mockito:mockito-core:5.24.0"
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.release = 11
}

// JUnit 6 requires Java 17; the published SDK continues to target Java 11.
tasks.named('compileTestJava', JavaCompile) {
    options.release = 17
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('tag', 'http.response.details:a:HTTP response details')
}

test {
    useJUnitPlatform()
}

mavenPublishing {

    publishToMavenCentral()
    signAllPublications()

    pom {
        name = "FormKiQ Client"
        description = "The Official Client library for FormKiQ"
        inceptionYear = "2020"
        url = "https://github.com/formkiq/formkiq-java-client"
        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "http://www.apache.org/licenses/LICENSE-2.0.txt"
            }
        }
        developers {
            developer {
                id = 'mfriesen'
                name = 'Mike Friesen'
            }
        }
        scm {
            url = 'https://github.com/formkiq/formkiq-java-client.git'
            connection = 'scm:git:git://github.com/formkiq/formkiq-java-client.git'
            developerConnection = 'scm:git:ssh://github.com/formkiq/formkiq-java-client.git'
        }
    }
}

compileJava.dependsOn(tasks.spotlessApply)
check.dependsOn(tasks.publishToMavenLocal)
